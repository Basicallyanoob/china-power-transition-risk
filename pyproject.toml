[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transition-risk"
version = "0.1.0"
description = "Carbon-cost transition-risk screener for Chinese power plants, built on public data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Michael S H Xiang"}]
dependencies = [
  "pandas>=2.0",
  "geopandas>=0.14",
  "pyogrio>=0.7",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
